[package]
name = "grid-table-xlsx-module"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Emacs dynamic module that reads and writes xlsx files for grid-table"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
emacs = "0.23"
umya-spreadsheet = "3.1"
# To give a written workbook back its external links, which umya has no
# model for: the parts of the package are copied as they were.
quick-xml = "0.41"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# umya-spreadsheet 3.1.1 with the fixes grid-table needs, kept in vendor/
# (see vendor/umya-spreadsheet/GRID-TABLE.md).
[patch.crates-io]
umya-spreadsheet = { path = "vendor/umya-spreadsheet" }
